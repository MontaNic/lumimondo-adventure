<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lumimondo Adventure</title>
  <meta name="description" content="Un'avventura per diventare Maestro Allenatore di Lumini!">

  <!-- PWA -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff8c28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumimondo">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #1a1a2e; touch-action: none; overscroll-behavior: none;
      font-family: system-ui, -apple-system, sans-serif; }
    /* Il contenitore è inset dalle SAFE-AREA (notch, status bar, home indicator):
       così il canvas NON va sotto le tacche e il tocco cade dove punti il dito.
       Era la causa del "devo cliccare in alto a sinistra". Su schermi senza tacche
       env() vale 0 → riempie comunque tutto. */
    #gioco { position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); }
    #gioco canvas { display: block; }

    /* "Gira il telefono": il gioco si fruisce meglio in ORIZZONTALE. Su iOS non si
       può forzare la rotazione, quindi mostriamo questo invito a tutto schermo SOLO
       sugli SMARTPHONE in verticale (lato corto ≤ 560px). I tablet (iPad) e il
       landscape non lo vedono. Il canvas resta sotto, intatto. */
    #ruota { display: none; }
    @media screen and (orientation: portrait) and (max-width: 560px) {
      #ruota { display: flex; position: fixed; inset: 0; z-index: 100000;
        background: linear-gradient(160deg, #ff8c28 0%, #b5471a 55%, #1a1a2e 100%);
        color: #fff; align-items: center; justify-content: center; text-align: center;
        font-family: system-ui, -apple-system, sans-serif; padding: 24px; }
    }
    .ruota-emoji { font-size: 66px; display: inline-block; animation: ruotaSpin 2.4s ease-in-out infinite; }
    .ruota-txt { font-size: 23px; font-weight: bold; margin-top: 20px; line-height: 1.5; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .ruota-txt span { display: block; font-size: 16px; font-weight: normal; opacity: .92; margin-top: 6px; }
    @keyframes ruotaSpin { 0%, 38% { transform: rotate(0deg); } 62%, 100% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="gioco"></div>
  <div id="ruota" aria-hidden="true">
    <div>
      <div class="ruota-emoji">📱</div>
      <div class="ruota-txt">Gira il telefono!<span>Lumimondo si gioca in orizzontale 🌈</span></div>
    </div>
  </div>

  <!-- Phaser 3 vendorizzato (zero npm / zero build step) -->
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/game/main.js"></script>
</body>
</html>
